name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write
  # Lets npm verify the publish came from this workflow, so no token is
  # stored anywhere and the package carries a provenance attestation.
  id-token: write

jobs:
  # A dispatched run bumps the version and pushes the tag, which triggers the
  # publish job below through the tag trigger.
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install the zstd CLI
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: The suite must pass before anything is tagged
        run: npm test

      - name: Bump and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "${{ inputs.bump }}" -m "chore: release %s"
          git push --follow-tags

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry-url here on purpose: it writes an .npmrc expecting a token,
      # and an empty one makes npm attempt token auth instead of using OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install the zstd CLI
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: The tag must match the version in package.json
        run: |
          tag="${GITHUB_REF_NAME}"
          declared="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$declared" ]; then
            echo "::error::tag $tag does not match package.json version $declared"
            exit 1
          fi
          echo "releasing $declared"

      - name: Nothing ships untested
        run: npm test

      # Trusted publishing needs a newer npm than Node bundles.
      - run: npm install -g npm@latest

      # Authenticated by OIDC through the trusted publisher configured for
      # this package on npmjs.com. No token is stored anywhere.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Build the release notes
        run: |
          {
            echo "Published to npm as \`zstd-js@${GITHUB_REF_NAME}\`."
            echo
            echo "## Compression"
            echo
            node scripts/benchmark.js
            echo
            echo "Measured on Node $(node --version). The zstd and gzip columns come from"
            echo "the libraries this runtime was built against."
          } > release-notes.md

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --generate-notes \
            --latest
